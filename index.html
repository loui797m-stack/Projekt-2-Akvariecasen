<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/css.css" />
  </head>
  <body>
    <main>
      <!-- Tekstområde i toppen-->
      <header>
        <h1>Dyk ned og syng med fiskene!</h1>
        <p>Tryk på knappen og tag med på et musikalsk undervandseventyr!</p>
      </header>

      <!--Selve det store vandområde hvor interaktion sker-->
      <section id="water-area">
        <button id="fish-1" class="clean-btn">
          <img src="svg/louises_hammerhaj.svg" alt="Fisk 1" />
        </button>
        <button id="fish-2" class="clean-btn">
          <img src="css/fisk2.svg" alt="Fisk 2" />
        </button>
        <button id="fish-3" class="clean-btn">
          <img src="css/fisk3.svg" alt="Fisk 3" />
        </button>
      </section>

      <section id="seabed">
        <!-- Flaskeposten -->
        <button id="message-bottle" class="clean-btn">
          <img src="svg/flaskepost.svg" alt="Hemmelig flaskepost på havbund" />
        </button>

        <!-- Krabben -->
        <button class="placeholder-btn" id="crab">krabbe</button>
      </section>
    </main>
    <script src="js/js.js" defer></script>
  </body>
</html>
