<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akvarie</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,600;0,700;1,800&display=swap"
    />
    <link rel="stylesheet" href="css/css.css" />
  </head>
  <body>
    <main class="aquarium">
      <img
        id="center-logo"
        src="svg/STORCENTER_NORD-removebg-preview.png"
        alt="Storcenter Nord"
      />
      <!-- LAG 1: Baggrundsvandet (Styrer hele sidens højde, så scroll virker perfekt) -->
      <img
        src="css/Baggrund.svg"
        class="layer back-layer"
        alt="Vand baggrund"
      />

      <!-- LAG 2: Det interaktive lag (Fisk, flaskepost og tekst) -->
      <div id="interactive-layer">
        <!-- Tekstområde i toppen -->
        z
        <header id="intro-header">
          <h1>Dyk ned og syng med fiskene!</h1>
          <p>Tryk på knappen og tag med på et musikalsk undervandseventyr!</p>
          <button id="dive-btn" class="jelly-dive" type="button">
            <img src="svg/louises_krabbe.svg" class="crab-icon" alt="" />
            <span>DYK NED!</span>
          </button>
        </header>
        <!-- Selve det store vandområde, hvor fiskene svømmer -->
        <section id="water-area">
          <!-- F001 Hornfisk (Klaudia) -->
          <button data-fish-id="F001" id="hornfisk" class="clean-btn">
            <img src="svg/klaudias_Hornfisk.svg" alt="Hornfisk" />
          </button>

          <!-- F002 Konge-febars (Klaudia) -->
          <button data-fish-id="F002" id="konge-febars" class="clean-btn">
            <img src="svg/Klaudias_Konge-febars.svg" alt="Konge-febars" />
          </button>

          <!-- F003 Papegøjefisk (Oksana) -->
          <button data-fish-id="F003" id="papegoejefisk" class="clean-btn">
            <img src="svg/oksanas_papegøjefisk.svg" alt="Papegøjefisk" />
            <!-- TJEK filnavn -->
          </button>

          <!-- F004 Søhest (Louise) -->
          <button data-fish-id="F004" id="soehest" class="clean-btn">
            <img src="svg/louises_soehest.svg" alt="Søhest" />
          </button>

          <!-- F005 Pincetfisk (Louise) -->
          <button data-fish-id="F005" id="pincetfisk" class="clean-btn">
            <img src="svg/louises_pincetfisk.svg" alt="Pincetfisk" />
            <!-- TJEK filnavn -->
          </button>

          <!-- F007 Nutte / pindsvinefisk (Louise) -->
          <button data-fish-id="F007" id="louises_nutte" class="clean-btn">
            <img
              id="nutte_img"
              src="svg/louises_nutte1.svg"
              alt="Pindsvinefisk"
            />
          </button>

          <!-- F008 Hammerhaj (Louise) -->
          <button data-fish-id="F008" id="hammerhaj" class="clean-btn">
            <img src="svg/louises_hammerhaj.svg" alt="Hammerhaj" />
          </button>

          <!-- Infoboks (hører til alle fiskene, derfor sidst i vandområdet) -->
          <div id="fishInfo" class="fish-info" hidden>
            <button id="closeFishInfo" aria-label="Luk">×</button>
            <h2 id="fishName"></h2>
            <p id="fishHabitat"></p>
            <p id="fishFact"></p>
          </div>
        </section>

        <!-- Havbunden med knapperne -->
        <section id="seabed">
          <button id="message-bottle" class="clean-btn">
            <img
              src="svg/louises_flaskepost.svg"
              alt="Hemmelig flaskepost på havbund"
            />
          </button>
          <button id="crab-1" data-fish-id="F006" class="clean-btn">
            <img src="svg/louises_krabbe.svg" alt="Krabbe 1" />
          </button>
        </section>
      </div>

      <img src="svg/bobler.svg" class="bobler" id="bobler_1" alt="bobler" />
      <img src="svg/bobler.svg" class="bobler" id="bobler_2" alt="bobler" />

      <!-- LAG 3: Sandet og tangen der ligger yderst (Dækker over fiskene) -->
      <img
        src="svg/Sand_forgrund.svg"
        class="layer front-layer"
        alt="Havbund sand"
      />

      <img
        src="svg/mellemgrund.svg"
        class="layer second-layer"
        alt="pink koral"
      />

      <img
        src="svg/baggrund.svg"
        class="layer third-layer"
        alt="Sten og tang baggrund"
      />
    </main>
    <dialog id="map-overlay">
      <figure class="map-container">
        <img src="svg/kort.svg" alt="Kort over centeret" id="center-map" />
        <figcaption>Klik hvor som helst for at lukke</figcaption>
      </figure>
    </dialog>
    <script src="js/fiskData.js" defer></script>
    <script src="js/js.js" defer></script>
    <script src="./elastic-mesh.js" defer></script>
  </body>
</html>
